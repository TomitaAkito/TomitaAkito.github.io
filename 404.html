---
layout: default
title: "404 Not Found"
permalink: /404.html
---

<section class="section">
  <div class="container" style="text-align: center; max-width: 600px; padding: 80px 20px; margin: 0 auto;">
    
    <h1 style="font-size: 6rem; font-weight: 800; color: var(--color-main); margin-bottom: 10px; line-height: 1;">404</h1>
    <h2 style="font-size: 1.8rem; margin-bottom: 24px;">Page Not Found</h2>
    
    <p style="color: var(--color-text-sub); margin-bottom: 40px; line-height: 1.8;">
      お探しのページは削除されたか、URLが間違っている可能性があります。<br>
      <span style="font-weight: bold; color: var(--color-text);">10秒後</span>に自動的にトップページへ移動します。
    </p>

    <!-- 10秒のプログレスバー -->
    <div style="width: 100%; height: 8px; background-color: var(--color-border); border-radius: 999px; overflow: hidden; margin-bottom: 40px;">
      <div class="progress-bar"></div>
    </div>

    <a href="{{ '/' | relative_url }}" class="btn">今すぐトップページへ戻る</a>
    
  </div>
</section>

<style>
/* プログレスバーのアニメーション */
.progress-bar {
  width: 0%;
  height: 100%;
  background-color: var(--color-main);
  /* 10秒かけて左から右へゲージがたまる */
  animation: progress 10s linear forwards;
}

@keyframes progress {
  0% { width: 0%; }
  100% { width: 100%; }
}
</style>

<script>
  // 10秒後にトップページへリダイレクト
  document.addEventListener('DOMContentLoaded', () => {
    // 既存のフェードイン/アウト遷移と連携させるため、
    // 9.5秒経過時にフェードの幕を下ろす（is-changingを付与）
    setTimeout(() => {
      document.body.classList.add('is-changing');
      
      // 幕が下りきった10秒(500ms後)に遷移を実行
      setTimeout(() => {
        window.location.href = "{{ '/' | relative_url }}";
      }, 500);
      
    }, 9500);
  });
</script>
